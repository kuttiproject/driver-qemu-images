#_preseed_V1

### Localization
d-i debian-installer/language string en
d-i debian-installer/country string IN
d-i debian-installer/locale string en_US.UTF-8

# Keyboard selection
d-i keyboard-configuration/xkb-keymap select us

### Disable Firmware Prompts
d-i hw-detect/load_firmware boolean false

### Network configuration
d-i mirror/country string manual
d-i mirror/http/hostname string http.us.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Account setup
d-i passwd/root-password password Pass@word1
d-i passwd/root-password-again password Pass@word1

# Create normal user
d-i passwd/user-fullname string Kutti Admin
d-i passwd/username string kuttiadmin
d-i passwd/user-password password Pass@word1
d-i passwd/user-password-again password Pass@word1

### Clock and time zone setup
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Kolkata
d-i clock-setup/ntp boolean true

### Partitioning
d-i partman-auto/method string regular
d-i partman-auto-lvm/guided_size string max

# Single partition, bootable, ext4
d-i partman-auto/expert_recipe string                         \
      boot-root ::                                            \
              500 10000 1000000000 ext4                       \
                      $primary{ } $bootable{ }                \
                      method{ format } format{ }              \
                      use_filesystem{ } filesystem{ ext4 }    \
                      mountpoint{ / }                         \
              .

d-i partman-basicfilesystems/no_swap boolean false
d-i partman-md/confirm boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm_nooverwrite boolean true

### Base system installation
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false   
d-i apt-setup/cdrom/set-failed boolean false

# Keep recommends disabled to save space
d-i base-installer/install-recommends boolean false

# Let base-installer select the default standard kernel from CD
d-i base-installer/kernel/image string linux-image-amd64

### Package selection
tasksel tasksel/first multiselect
popularity-contest popularity-contest/participate boolean false

# We intentionally leave pkgsel/include empty here to prevent pkgsel 
# from triggering APT media prompts while the CD-ROM entry is active.
d-i pkgsel/include string sudo openssh-server openssh-client dbus

### Boot loader installation
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string /dev/vda

### Finishing up the installation
d-i finish-install/reboot_in_progress note

d-i preseed/late_command string \
    mkdir -p /target/etc/sudoers.d && echo "%kuttiadmin ALL=(ALL:ALL) NOPASSWD:ALL" > /target/etc/sudoers.d/kutti && chmod 0440 /target/etc/sudoers.d/kutti; \
    in-target apt-get update; \
    in-target apt-get install -y --no-install-recommends linux-image-cloud-amd64;

